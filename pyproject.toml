[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "steganografia"
version = "0.2.0"
description = "Watermarking algorithms for LLM-generated text and a desktop app to test them"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "torch>=2.0", "transformers>=4.40", "accelerate>=0.26", "matplotlib>=3.7",
    "PySide6>=6.6", "pymupdf>=1.24", "reportlab>=4.0", "pytest>=7.0", "pytest-qt>=4.2",
]
